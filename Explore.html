<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore</title>

  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/Explore.css">

  <!-- Bootstrap JS (optional) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

 
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light shadow" style="background-color: #ffffff;">
    <div class="container">
      <a href="Home.html">
        <img src="assets/images/logo.png" alt="Logo" height="130">
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#myNavbar"
        aria-controls="myNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="myNavbar">

        <ul class="nav mx-auto">
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Explore.html">Explore</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Itinerary.html">Itinerary</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Weather.html">Weather</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Carbon.html">Carbon Footprint</a>
          </li>
        </ul>

        <ul class="nav ">
          <li class="nav-item">
            <a href="Main.html" class="btn btn-primary join-us">Join Us</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Search Bar -->
  <div class="container-fluid mt-5 container-explore shadow p-4">
    <form class="row g-3 align-items-end">
      <div class="col-md-4">
        <label for="place" class="form-label">Place</label>
        <input type="text" class="form-control" id="place" placeholder="Enter destination">
      </div>
      <div class="col-md-4">
        <label for="travelDate" class="form-label">Date</label>
        <input type="date" class="form-control" id="travelDate">
      </div>
      <div class="col-md-3">
        <label for="type" class="form-label">Categories</label>
        <select class="form-select form-control" id="type">
          <option selected>Choose...</option>
          <option value="nature">Nature</option>
          <option value="historical">Historical</option>
          <option value="beach">Beach</option>
          <option value="city">City</option>
          <option value="mountain">Mountain</option>
        </select>
      </div>
      <div class="col-md-1">
        <button type="submit" class="btn btn-success w-100">Search</button>
      </div>
    </form>
  </div>

  <!-- Main Grid: Sidebar + Places -->
  <div class="container mt-5">
    <div class="d-grid-container">

      <!-- Sidebar -->
      <div class="left-sidebar p-4 shadow">
        <h5 class="mb-3">Filter Options</h5>
        <ul class="list-group">
          <li class="list-group-item">Popular</li>
          <li class="list-group-item">Nearby</li>
          <li class="list-group-item">Budget</li>
          <li class="list-group-item">Trending</li>
        </ul>
      </div>

      <!-- Place Cards -->
      <div class="right-content shadow p-4">
        <div class="row">
          <!-- Loop of 12 Places -->
          <!-- You can generate these dynamically later -->
          <!-- Row 1 to 3: 4 items per row using col-md-3 -->
          <!-- Place 1 to 12 -->
          <!-- Repeat this block with different names or images -->
          <!-- Example for Place 1 -->
          <!-- Copy this 12 times and change the names -->
          <!-- Place 1 -->
          <div class="col-md-3 mb-4">
            <div class="shadow p-3 text-center h-100">
              <div class="place-image">
                <img src="assets/images/logo.png" alt="Place 1" class="img-fluid rounded">
              </div>
              <p class="place-name mt-2">Place 1</p>
            </div>
          </div>
          <!-- Place 2 to 12 -->
          <!-- Repeat the same block and change name accordingly -->
          <!-- For simplicity, we'll clone with same content -->
          <!-- Repeat 11 more -->
          <!-- Copy-paste below block 11 more times -->
          <!-- For demo, keeping only a few -->
          <div class="col-md-3 mb-4">
            <div class="shadow p-3 text-center h-100">
              <div class="place-image">
                <img src="assets/images/logo.png" alt="Place 2" class="img-fluid rounded">
              </div>
              <p class="place-name mt-2">Place 2</p>
            </div>
          </div>
          <div class="col-md-3 mb-4">
            <div class="shadow p-3 text-center h-100">
              <div class="place-image">
                <img src="assets/images/logo.png" alt="Place 3" class="img-fluid rounded">
              </div>
              <p class="place-name mt-2">Place 3</p>
            </div>
          </div>
          <div class="col-md-3 mb-4">
            <div class="shadow p-3 text-center h-100">
              <div class="place-image">
                <img src="assets/images/logo.png" alt="Place 4" class="img-fluid rounded">
              </div>
              <p class="place-name mt-2">Place 4</p>
            </div>
          </div>
          <!-- Repeat for Place 5 to 12... -->
        </div>
      </div>
    </div>
  </div>

</body>
</html>
