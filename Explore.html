 <main class="explore-content">
  <div class="container-explore-v2 my-4">
    <div class="card p-4 shadow-sm">
      <form class="row g-3 align-items-end">
        <div class="col-md-9">
          <label for="locationInput" class="form-label">Location</label>
          <input type="text" class="form-control" id="locationInput" placeholder="e.g. Kuala Lumpur">
        </div>
        <div class="col-md-3">
          <button type="submit" class="btn btn-success rounded-pill w-100">Search</button>
        </div>
      </form>


      <!-- Buttons on opposite sides -->
      <div class="mt-3 d-flex justify-content-center gap-4">
        <button type="button" class="btn filter-btn ">Go eco!</button>
        <button type="button" class="btn fav-btn">Favourite</button>
      </div>

    </div>
  </div>




  <!-- All Cards Section -->
  <div  class=" container my-5">
   <div id="cards-container" class="row">

   </div>
  </div>

  <!-- favourite section -->
   <div  class=" container my-5">
   <div id="favourite-card-container" class="row">

   </div>
  </div>
</main> 


  <div class="modal fade" id="placeDetailModal" tabindex="-1" aria-labelledby="placeDetailModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalPlaceTitle">Place Title</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span>&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <img id="modalPlaceImage" src="" class="modal-img" alt="Place Image">

          <p id="modalPlaceLocation" class="text-muted"></p>
          <p id="modalPlaceDesc"></p>
          <p><strong>Tags:</strong> <span id="modalPlaceTags"></span></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
