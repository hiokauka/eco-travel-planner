<!DOCTYPE html>
<html lang="en">

<head>
    <!-- your existing meta and link tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teroka - Sticky Note Layout</title>

    <link rel="icon" type="image/png" href="assets/images/logo.svg">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/test.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

    <style>
        html,
        body {
            height: auto;
            min-height: 100%;
            overflow-x: hidden;
        }

        .container-post {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        #postsContainer {
            column-count: 4;
            column-gap: 1rem;
        }

        .post-card {
            display: inline-block;
            background-color: #fdfd96;
            margin: 0 0 1rem;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            word-wrap: break-word;
            transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.5s ease;
        }


        .post-card:hover {
            transform: scale(1.03) rotate(0deg) !important;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.2);
        }

        .post-card.show {
            opacity: 1;
        }

        .post-card img {
            max-width: 100%;
            border-radius: 5px;
            margin-top: 10px;
        }

        #newPostBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Teroka</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>
            </ul>
        </div>
    </nav>


        <!-- Posts Container -->
        <div class="container-post">
            <h3 class="mb-4 text-center">Community Feed</h3>
            <div id="postsContainer"></div>
        </div>

    <!-- New Post Button -->
    <button id="newPostBtn" class="btn btn-success" title="Create new post" data-toggle="modal"
        data-target="#newPostModal">
        <i class="bi bi-plus-lg"></i>
    </button>

    <div class="modal fade" id="newPostModal" tabindex="-1" role="dialog" aria-labelledby="newPostModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <form id="newPostForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="newPostModalLabel">Create New Post</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="postText">Post Text</label>
                            <textarea class="form-control" id="postText" rows="3" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="postImage">Upload Image (optional)</label>
                            <input type="file" class="form-control-file" id="postImage" accept="image/*">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Post</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- JavaScript -->
    <script>
        const postsContainer = document.getElementById('postsContainer');
        const newPostForm = document.getElementById('newPostForm');

        let posts = [
            { id: 1, text: "Just came back from hiking in the beautiful Cameron Highlands!", image: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=60" },
            { id: 2, text: "Loving the new eco-friendly travel app I've been using!", image: null },
            { id: 3, text: "Does anyone know the best places to visit in Langkawi?", image: "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=60" }
        ];

        function createPostElement(post, isNew = false) {
            const postCard = document.createElement('div');
            postCard.className = 'post-card';

            // Random rotation between -4 and 4 degrees
            const randomAngle = Math.floor(Math.random() * 9) - 4;
            postCard.style.transform = `rotate(${randomAngle}deg)`;

            const postText = document.createElement('p');
            postText.textContent = post.text;
            postCard.appendChild(postText);

            if (post.image) {
                const img = document.createElement('img');
                img.src = post.image;
                img.alt = 'Post Image';
                postCard.appendChild(img);
            }

            postsContainer.appendChild(postCard);

            // Trigger fade-in if it's a newly added post
            if (isNew) {
                setTimeout(() => {
                    postCard.classList.add('show');
                }, 10); // Small delay to ensure CSS transition works
            } else {
                postCard.classList.add('show');
            }
        }

        function renderPosts() {
            postsContainer.innerHTML = '';
            posts.forEach(post => {
                createPostElement(post);
            });
        }

        newPostForm.addEventListener('submit', e => {
            e.preventDefault();

            const text = document.getElementById('postText').value.trim();
            const imageInput = document.getElementById('postImage');

            if (!text && imageInput.files.length === 0) {
                alert('Please enter text or upload an image!');
                return;
            }

            if (imageInput.files.length) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    addPost(text, event.target.result);
                    $('#newPostModal').modal('hide');
                    newPostForm.reset();
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                addPost(text, null);
                $('#newPostModal').modal('hide');
                newPostForm.reset();
            }
        });

        function addPost(text, image) {
            const newPost = { id: Date.now(), text, image };
            posts.unshift(newPost);
            createPostElement(newPost, true);
        }

        renderPosts();
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>

</html>
