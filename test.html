<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Place Finder</title>
    <style>
        .card {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 1rem;
            margin: 1rem 0;
            display: flex;
            gap: 1rem;
        }

        .card img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h1>Search Places</h1>
    <input type="text" id="searchInput" placeholder="e.g. park in Melaka">
    <button onclick="searchPlaces()">Search</button>

    <div id="results"></div>

    <script>
        async function searchPlaces() {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            try {
                const res = await fetch(`http://localhost:3000/api/places?query=${encodeURIComponent(query)}`);

                if (!res.ok) {
                    resultsDiv.innerHTML = `<p>Error fetching places: ${res.status}</p>`;
                    console.error('Fetch error:', res.statusText);
                    return;
                }

                const data = await res.json();

                console.log('API response:', data);

                if (!data.places || !Array.isArray(data.places) || data.places.length === 0) {
                    resultsDiv.innerHTML = '<p>No results found.</p>';
                    console.log('No places found in response');
                    return;
                }

                data.places.forEach(place => {
                    const card = document.createElement('div');
                    card.className = 'card';



                    const photoUrl = place.photo || 'https://via.placeholder.com/150';

                    card.innerHTML = `
                    <img src="${photoUrl}" alt="Place photo" />
                    <div>
                        <h2>${place.name}</h2>
                        <p><strong>Address:</strong> ${place.address || 'N/A'}</p>
                        <p><strong>Rating:</strong> ⭐ ${place.rating || 'No rating'}</p>
                        <p><strong>Types:</strong> ${place.types ? place.types.join(', ') : 'N/A'}</p>
                    </div>
                `;
                    resultsDiv.appendChild(card);
                });



            } catch (error) {
                resultsDiv.innerHTML = `<p>Error fetching data</p>`;
                console.error('Fetch failed:', error);
            }
        }

    </script>
</body>

</html>
