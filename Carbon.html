<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teroka</title>

  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/Carbon.css">

  <!-- Bootstrap JS (optional) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

 
</head>
<body class="home">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #ffffff ;">
    <div class="container">
      <a href="Home.html">
        <img src="assets/images/logo.svg" alt="Logo" class="navbar-logo">
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#myNavbar"
        aria-controls="myNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse  justify-content-between" id="myNavbar">

        <ul class="nav mx-auto">
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Explore.html">Explore</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Itinerary.html">Itinerary</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Weather.html">Weather</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Carbon.html">Carbon Footprint</a>
          </li>
        </ul>

        <ul class="nav ">
          <li class="nav-item">
            <a href="Login.html" class="btn btn-success rounded-pill join-us">Join Us</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-carbon my-5">
    <div class="card shadow p-4">
      <h3 class="mb-4">Carbon Footprint Calculator</h3>
  
      <!-- Transport Type -->
      <div class="form-group">
        <label for="transportType">Transportation</label>
        <select class="form-control" id="transportType">
          <option value="flight">Flight</option>
          <option value="car">Car</option>
          <option value="train">Train</option>
        </select>
      </div>
  
      <!-- Distance -->
      <div class="form-group">
        <label for="distance">Distance (km)</label>
        <input type="number" class="form-control" id="distance" placeholder="e.g. 500">
      </div>
  
      <!-- Accommodation -->
      <div class="form-group">
        <label for="accommodation">Accommodation Type</label>
        <select class="form-control" id="accommodation">
          <option value="hotel">Hotel</option>
          <option value="eco-lodge">Eco-Lodge</option>
          <option value="hostel">Hostel</option>
        </select>
      </div>
  
      <!-- Nights -->
      <div class="form-group">
        <label for="nights">Number of Nights</label>
        <input type="number" class="form-control" id="nights" placeholder="e.g. 3">
      </div>
  
      <!-- Buttons -->
      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-success" onclick="calculateCarbon()">Calculate</button>
        <button class="btn btn-primary" onclick="suggestOffsets()">Offset Tips</button>
      </div>
  
      <!-- Results -->
      <div class="mt-4" id="resultDisplay" style="display:none;">
        <h5>Total Estimated CO₂ Emissions:</h5>
        <p id="carbonOutput">0 kg CO₂</p>
      </div>
  
      <!-- Offset Suggestions -->
      <div class="mt-4" id="offsetSuggestions" style="display:none;">
        <h5>Offset Recommendations:</h5>
        <ul id="suggestionList"></ul>
      </div>
    </div>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Get all the nav links
      const navLinks = document.querySelectorAll('.navbar .nav-link');
      
      // Get the current URL
      const currentUrl = window.location.href;
  
      // Loop through each link to check if the href matches the current URL
      navLinks.forEach(function (link) {
        const linkUrl = link.getAttribute('href');
        
        if (currentUrl.includes(linkUrl)) {
          // Add the 'active' class to the matching link
          link.classList.add('active');
        } else {
          // Remove the 'active' class from others
          link.classList.remove('active');
        }
      });
    });
  </script>
  
 

</body>
</html>
