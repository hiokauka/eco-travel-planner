<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>

  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/home.css">

  <!-- Optional Bootstrap JavaScript (for interactive components like modals, dropdowns, etc.) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #ffffff;">
    <div class="container">
      <a class="navbar-brand" href="#">Me</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#myNavbar"
        aria-controls="myNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="myNavbar">

        <ul class="nav mx-auto">
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="#">Explore</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="#">Itinerary</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="#">Weather</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="#">Carbon Footprint</a>
          </li>
        </ul>

        <ul class="nav ">
          <li class="nav-item">
            <button class="btn btn-primary join-us" type="button">Join Us</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>


  <div class="container mt-1">
    <div class="row">
      <div class="col text-start lines-main">
        <h2 class="display-4">Your journey</h2>
        <h3 class="display-5">The earth's future </h3>
      </div>
    </div>
  </div>

  <div class="container mt-5 container-explore shadow p-4">
    <form class="row g-3 align-items-end">

      <div class="col-md-4">
        <label for="place" class="form-label">Place</label>
        <input type="text" class="form-control" id="place" placeholder="Enter destination">
      </div>


      <div class="col-md-4">
        <label for="travelDate" class="form-label">Date</label>
        <input type="date" class="form-control" id="travelDate">
      </div>


      <div class="col-md-3">
        <label for="type" class="form-label">Categories</label>
        <select class="form-select" id="type">
          <option selected>Choose...</option>
          <option value="nature">Nature</option>
          <option value="historical">Historical</option>
          <option value="beach">Beach</option>
          <option value="city">City</option>
          <option value="mountain">Mountain</option>
        </select>
      </div>


      <div class="col-md-1">
        <button type="submit" class="btn btn-success w-100">Search</button>
      </div>
    </form>
  </div>






</body>
