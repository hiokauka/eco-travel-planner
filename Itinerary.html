<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teroka</title>

    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/itinerary.css" />

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="home">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white">
        <div class="container">
            <a href="Home.html">
                <img src="assets/images/logo.svg" alt="Logo" class="navbar-logo" />
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#myNavbar"
                aria-controls="myNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-between" id="myNavbar">
                <ul class="nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link btn custom-btn rounded-pill mx-4" href="Explore.html">Explore</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn custom-btn rounded-pill mx-4" href="Itinerary.html">Itinerary</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn custom-btn rounded-pill mx-4" href="Weather.html">Weather</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn custom-btn rounded-pill mx-4" href="Carbon.html">Carbon Footprint</a>
                    </li>
                </ul>
                <ul class="nav">
                    <li class="nav-item">
                        <a href="Login.html" class="btn btn-success rounded-pill join-us">Join Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Itinerary Form -->
    <div class="container-itinerary my-5">
        <div class="card shadow p-4">
            <h4 class="mb-4 text-center">Create Your Green Itinerary</h4>
            <form id="itineraryForm">
                <div class="mb-3">
                    <label for="destination" class="form-label">Destination</label>
                    <input type="text" id="destination" class="form-control" placeholder="Enter destination" required>
                </div>

                <div class="mb-3">
                    <label for="budget" class="form-label">Budget (RM)</label>
                    <input type="number" id="budget" class="form-control" placeholder="Enter budget" required>
                </div>

                <div class="mb-3">
                    <label for="interest" class="form-label">Interest</label>
                    <select id="interest" class="form-control">
                        <option value="wildlife">Wildlife</option>
                        <option value="museums">Museums</option>
                        <option value="hiking">Hiking</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="vacationLength" class="form-label">How many days is your vacation?</label>
                    <input type="number" id="vacationLength" class="form-control" placeholder="Number of days" required>
                </div>

                <button type="submit" class="btn btn-success custom-margin">See available place</button>
                <button type="button" class="btn btn-success custom-margin1" id="viewItineraryBtn">See your
                    itinerary</button>
            </form>

            <!-- Modal for displaying filtered results -->
            <div class="modal fade" id="resultsModal" tabindex="-1" aria-labelledby="resultsModalLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="resultsModalLabel">Suggested Eco-Friendly Activities</h5>
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="modal-body" id="activitiesResults">
                            <!-- Filtered activities with day selection will be displayed here -->
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-success" id="addToItineraryBtn" data-dismiss="modal"
                                style="display:none;">Add to Itinerary</button>
                            <button type="button" class="btn btn-success" id="saveItinerary" data-dismiss="modal">Save
                                Itinerary</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedActivities = {};

        document.getElementById('itineraryForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Get user input values
            const destination = document.getElementById('destination').value;
            const budget = document.getElementById('budget').value;
            const interest = document.getElementById('interest').value;
            const vacationLength = document.getElementById('vacationLength').value;

            // Define some sample eco-friendly activities
            const activities = [
                { name: 'Wildlife Safari', interest: 'wildlife', price: 100, description: 'An eco-friendly safari experience' },
                { name: 'Eco Museum', interest: 'museums', price: 50, description: 'Visit an environmentally sustainable museum' },
                { name: 'Nature Hiking', interest: 'hiking', price: 30, description: 'Eco-friendly hiking in nature reserves' },
                { name: 'Beach Clean-Up', interest: 'wildlife', price: 0, description: 'Join a local beach clean-up effort' },
                { name: 'Cycling Tour', interest: 'hiking', price: 70, description: 'Cycle through eco-friendly routes' },
            ];

            // Filter activities based on user input (interest and budget)
            const filteredActivities = activities.filter(activity =>
                activity.interest === interest && activity.price <= budget
            );

            // Display the filtered activities in the modal
            displayActivities(filteredActivities, vacationLength);
        });

        function displayActivities(activities, vacationLength) {
            const resultsContainer = document.getElementById('activitiesResults');
            resultsContainer.innerHTML = ''; // Clear previous results

            if (activities.length === 0) {
                resultsContainer.innerHTML = '<p>No activities found matching your criteria.</p>';
            } else {
                activities.forEach(activity => {
                    const activityCard = document.createElement('div');
                    activityCard.classList.add('card', 'p-3', 'my-2');
                    activityCard.innerHTML = `
                <h5>${activity.name}</h5>
                <p>${activity.description}</p>
                <p><strong>Price:</strong> RM${activity.price}</p>
                <label for="daySelection${activity.name}">Select day to add this activity:</label>
                <select id="daySelection${activity.name}" class="form-control">
                  ${generateDayOptions(vacationLength)}
                </select>
            `;
                    resultsContainer.appendChild(activityCard);

                    // Save the activity selection when user changes the day
                    document.getElementById(`daySelection${activity.name}`).addEventListener('change', function () {
                        const selectedDay = this.value;
                        if (!selectedActivities[selectedDay]) {
                            selectedActivities[selectedDay] = [];
                        }
                        selectedActivities[selectedDay].push(activity);

                        // Debug: Log selected activities
                        console.log("Selected Activities:", selectedActivities);

                        document.getElementById('addToItineraryBtn').style.display = 'inline-block';
                    });
                });
            }

            $('#addToItineraryBtn').show();
            $('#saveItinerary').hide();

            // Show the modal with the filtered results
            $('#resultsModal').modal('show');
        }

        function generateDayOptions(vacationLength) {
            let options = `<option value="" disabled selected>Select a Day</option>`; // Default option
            for (let i = 1; i <= vacationLength; i++) {
                options += `<option value="Day ${i}">Day ${i}</option>`;
            }
            return options;
        }

        // Display the itinerary when user clicks "See your itinerary"
        document.getElementById('viewItineraryBtn').addEventListener('click', function () {
            const itineraryContainer = document.getElementById('activitiesResults');
            itineraryContainer.innerHTML = ''; // Clear previous results

            if (Object.keys(selectedActivities).length === 0) {
                itineraryContainer.innerHTML = '<p>No activities added to your itinerary.</p>';
            } else {
                // Sort the days numerically to ensure correct order
                const sortedDays = Object.keys(selectedActivities).sort((a, b) => {
                    const dayA = parseInt(a.replace('Day ', ''));
                    const dayB = parseInt(b.replace('Day ', ''));
                    return dayA - dayB;
                });

                sortedDays.forEach(day => {
                    const dayActivities = selectedActivities[day];
                    const dayCard = document.createElement('div');
                    dayCard.classList.add('card', 'p-3', 'my-2');
                    dayCard.innerHTML = `<h5>${day}</h5>`;
                    dayActivities.forEach(activity => {
                        dayCard.innerHTML += `
                    <p>${activity.name} - RM${activity.price}</p>
                    <p>${activity.description}</p>
                `;
                    });
                    itineraryContainer.appendChild(dayCard);
                });
            }

            $('#addToItineraryBtn').hide();
            $('#saveItinerary').show();

            $('#resultsModal').modal('show');
        });

        // Add to itinerary functionality
        document.getElementById('addToItineraryBtn').addEventListener('click', function () {
            // Simply update the itinerary without saving
            const itineraryContainer = document.getElementById('activitiesResults');
            itineraryContainer.innerHTML = ''; // Clear previous results

            if (Object.keys(selectedActivities).length === 0) {
                itineraryContainer.innerHTML = '<p>No activities added to your itinerary.</p>';
            } else {
                // Sort the days numerically to ensure correct order
                const sortedDays = Object.keys(selectedActivities).sort((a, b) => {
                    const dayA = parseInt(a.replace('Day ', ''));
                    const dayB = parseInt(b.replace('Day ', ''));
                    return dayA - dayB;
                });

                sortedDays.forEach(day => {
                    const dayActivities = selectedActivities[day];
                    const dayCard = document.createElement('div');
                    dayCard.classList.add('card', 'p-3', 'my-2');
                    dayCard.innerHTML = `<h5>${day}</h5>`;
                    dayActivities.forEach(activity => {
                        dayCard.innerHTML += `
                    <p>${activity.name} - RM${activity.price}</p>
                    <p>${activity.description}</p>
                `;
                    });
                    itineraryContainer.appendChild(dayCard);
                });
            }

            // Hide the "Add to Itinerary" button after adding
            document.getElementById('addToItineraryBtn').style.display = 'none';
        });

        document.getElementById('saveItinerary').addEventListener('click', function () {
            // Create a new jsPDF instance
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Set PDF title
            doc.setFontSize(18);
            doc.text('My Green Itinerary', 20, 20);

            // Add each day's activities to the PDF
            let yPosition = 30; // Initial Y position for the content
            for (const day in selectedActivities) {
                const dayActivities = selectedActivities[day];
                doc.setFontSize(14);
                doc.text(day, 20, yPosition); // Add day heading (e.g. "Day 1")
                yPosition += 10;

                // Loop through activities for the current day
                dayActivities.forEach(activity => {
                    doc.setFontSize(12);
                    doc.text(`${activity.name} - RM${activity.price}`, 20, yPosition);
                    yPosition += 6;
                    doc.text(activity.description, 20, yPosition);
                    yPosition += 10; // Add spacing between activities
                });

                // Add a page if the content is overflowing
                if (yPosition > 270) {
                    doc.addPage();
                    yPosition = 20;
                }
            }

            // Save the PDF
            doc.save('itinerary.pdf');
        });

        document.addEventListener('DOMContentLoaded', function () {
            // Get all the nav links
            const navLinks = document.querySelectorAll('.navbar .nav-link');

            // Get the current URL
            const currentUrl = window.location.href;

            // Loop through each link to check if the href matches the current URL
            navLinks.forEach(function (link) {
                const linkUrl = link.getAttribute('href');

                if (currentUrl.includes(linkUrl)) {
                    // Add the 'active' class to the matching link
                    link.classList.add('active');
                } else {
                    // Remove the 'active' class from others
                    link.classList.remove('active');
                }
            });
        });

    </script>
</body>

</html>
