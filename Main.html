<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teroka</title>

  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <!-- Add in <head> -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <!-- Bootstrap JS (optional) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>

<body class="home">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #ffffff;">
    <div class="container">
      <a href="Home.html">
        <img src="assets/images/logo.svg" alt="Logo" class="navbar-logo">
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#myNavbar"
        aria-controls="myNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-between" id="myNavbar">

        <ul class="nav mx-auto">
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Explore.html">Explore</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Itinerary.html">Itinerary</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Weather.html">Weather</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Carbon.html">Carbon Footprint</a>
          </li>
        </ul>

        <ul class="nav">
          <li class="nav-item">
            <i class="bi bi-person" style="font-size: 40px; cursor: pointer;" data-toggle="modal"
              data-target="#profileModal"></i>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- User Profile Modal -->
  <div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="profileModalLabel">User Profile</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>

        <div class="modal-body">
          <p><strong><i class="fas fa-user"></i> Name:</strong> Abdul Rauf Hazim</p> <!-- User icon -->
          <p><strong><i class="fas fa-envelope"></i> Email:</strong> raufhazim@example.com</p> <!-- Envelope icon -->
          <p><strong><i class="fas fa-lock"></i> Password:</strong> *****</p> <!-- Lock icon -->
          <p><strong><i class="fas fa-phone"></i> Phone Number:</strong> 1234567</p> 



          <button class="btn btn-outline-info btn-sm mr-3 mb-3" type="button" data-toggle="collapse"
            data-target="#changePasswordSection">
            Change Password
          </button>

          <button class="btn btn-outline-success btn-sm mr-3 mb-3" type="button" data-toggle="collapse"
            data-target="#updateprofileSection">
            Update Profile
          </button>

          <button class="btn btn-outline-danger btn-sm mb-3" type="button" data-toggle="collapse"
            data-target="#deleteaccountSection">
            Delete Account
          </button>

          <div class="collapse" id="changePasswordSection">
            <form id="changePasswordForm">
              <div class="form-group">
                <label for="oldPassword">Old Password</label>
                <input type="password" class="form-control" id="oldPassword" required>
              </div>
              <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" class="form-control" id="newPassword" required>
              </div>
              <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" class="form-control" id="confirmPassword" required>
              </div>
              <button type="submit" class="btn btn-primary btn-sm">Update Password</button>
            </form>
          </div>

          <div class="collapse" id="updateprofileSection">
            <form id="updateProfileForm">
              <!-- Name Field -->
              <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
              </div>

              <!-- Email Field -->
              <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
              </div>

              <div class="form-group">
                <label for="email">Phone Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="Enter your Phone number" required>
              </div>



              <!-- Submit Button -->
              <button type="submit" class="btn btn-success btn-sm">Update Profile</button>
            </form>
          </div>

          <div class="collapse" id="deleteaccountSection">
            <div class="form-group">
              <label for="confirmDelete">Are you sure you want to delete your account?</label>
              <p class="text-danger">This action is irreversible.</p>
            </div>

            <!-- Yes/No Buttons -->
            <div class="form-group">
              <button type="button" class="btn btn-danger g-3" id="deleteYesButton">Yes, Delete My Account</button>

            </div>
          </div>

        </div>

        <div class="modal-footer">

          <i class="bi bi-box-arrow-right logout-icon" data-toggle="modal" data-dismiss="modal"
            data-target="#logoutModal"></i>
        </div>

      </div>
    </div>
  </div>


  <!-- Logout Confirmation Modal -->
  <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="logoutModalLabel">Logout Confirmation</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          Are you sure you want to logout?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" onclick="logoutUser()">Logout</button>
        </div>
      </div>
    </div>
  </div>

  <script>

    // Use JavaScript to control opening and closing of collapse sections
    $('#changePasswordSection,#updateprofileSection, #deleteaccountSection').on('show.bs.collapse', function () {
      // Close all other collapses when one is shown
      $('#changePasswordSection,#updateprofileSection, #deleteaccountSection').not(this).collapse('hide');
    });

    function logoutUser() {
      // Optionally clear any session or data if needed
      localStorage.clear(); // Example: Clear local storage (if you're using it)
      window.location.href = "Home.html"; // Redirect to Home page
    }
  </script>

</body>

</html>
