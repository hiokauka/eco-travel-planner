<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teroka</title>

  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/weather.css">

  <!-- Bootstrap JS (optional) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

 
</head>
<body class="home">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #ffffff ;">
    <div class="container">
      <a href="Home.html">
        <img src="assets/images/logo.svg" alt="Logo" class="navbar-logo">
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#myNavbar"
        aria-controls="myNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse  justify-content-between" id="myNavbar">

        <ul class="nav mx-auto">
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Explore.html">Explore</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Itinerary.html">Itinerary</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Weather.html">Weather</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn custom-btn rounded-pill mx-4" href="Carbon.html">Carbon Footprint</a>
          </li>
        </ul>

        <ul class="nav ">
          <li class="nav-item">
            <a href="Login.html" class="btn btn-success rounded-pill join-us">Join Us</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-weather my-5">
    <div class="card p-4 shadow-sm">
      <h4 class="mb-3">Weather Forecast</h4>
  
      <!-- City/Place Picker -->
      <div class="form-group">
        <label for="citySelect">Select a City</label>
        <select class="form-control" id="citySelect">
          <option value="kuala_lumpur">Kuala Lumpur</option>
          <option value="penang">Penang</option>
          <option value="melaka">Melaka</option>
          <!-- Add more cities -->
        </select>
      </div>
  
      <!-- Real-Time Weather Display -->
      <div class="weather-info mt-4 p-3 border rounded bg-light">
        <h5 id="weatherCity">Kuala Lumpur</h5>
        <p><strong>Temperature:</strong> <span id="weatherTemp">--°C</span></p>
        <p><strong>Humidity:</strong> <span id="weatherHumidity">--%</span></p>
        <p><strong>Description:</strong> <span id="weatherDesc">--</span></p>
      </div>
  
      <!-- Forecast -->
      <div class="forecast mt-4">
        <h6>3-Day Forecast</h6>
        <div class="row" id="forecastCards">
          <!-- Forecast cards will go here -->
          <div class="col-md-4">
            <div class="card text-center p-3">
              <p class="mb-1"><strong>Mon</strong></p>
              <p class="mb-0">🌧️ 27°C</p>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card text-center p-3">
              <p class="mb-1"><strong>Tue</strong></p>
              <p class="mb-0">⛅ 29°C</p>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card text-center p-3">
              <p class="mb-1"><strong>Wed</strong></p>
              <p class="mb-0">☀️ 31°C</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
 
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Get all the nav links
      const navLinks = document.querySelectorAll('.navbar .nav-link');
      
      // Get the current URL
      const currentUrl = window.location.href;
  
      // Loop through each link to check if the href matches the current URL
      navLinks.forEach(function (link) {
        const linkUrl = link.getAttribute('href');
        
        if (currentUrl.includes(linkUrl)) {
          // Add the 'active' class to the matching link
          link.classList.add('active');
        } else {
          // Remove the 'active' class from others
          link.classList.remove('active');
        }
      });
    });
  </script>
  

</body>
</html>
