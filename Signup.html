<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join us at Teroka</title>

  <link rel="icon" type="image/png" href="assets/images/logo.svg">
  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/signup.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Optional Bootstrap JavaScript (for interactive components like modals, dropdowns, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
  <div class="container-fluid min-vh-100">
    <div class="row h-100">

      <div class="col-md-7 d-none d-md-block p-0 bg-login container-logo">

        <img src="assets/images/logo.svg" alt="Logo" class="main-logo">

      </div>

      <!-- Right Side with Form -->
      <div class="col-md-5 d-flex justify-content-center align-items-center" style="border-left: 2px solid #316b3a;">
        <div class="card signup-card">
          <h3 class="text-center mb-4">Create Account</h3>
          <form id="signupForm">
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone" placeholder="e.g. 012-3456789" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Create a password" required>
            </div>
            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password"
                required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
          </form>
          <div class="text-center mt-3">
            <small>Already have an account? <a href="Login.html">Sign In</a></small>
          </div>
        </div>
      </div>


    </div>
  </div>

  <div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header" id="modalHeader">
          <h5 class="modal-title" id="messageModalLabel">Notification</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body d-flex align-items-center gap-2" id="modalMessage">
          <!-- Message will appear here -->
        </div>
        <div class="modal-footer">
          <button type="button" id="modalFooterBtn" class="btn" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  </div>

  <script src="assets/js/signup.js"></script>
</body>
