<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teroka</title>
  
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  
    <link rel="stylesheet" href="assets/css/login.css">
  
    <!-- Optional Bootstrap JavaScript (for interactive components like modals, dropdowns, etc.) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  
  </head>

  <body>
    <div class="container-fluid min-vh-100">
      <div class="row h-100">
        
        <!-- Left Side: Background -->
        <div class="col-md-7 d-none d-md-block p-0 bg-login container-logo">
          
           <img src="assets/images/logo.svg" alt="Logo" class="main-logo">
         
        </div>
  
        <div class="col-md-5 d-flex justify-content-center align-items-center p-4" style="border-left: 2px solid #316b3a;">
          <div class="card login-card">
            <h3 class="text-center mb-4">Sign In</h3>
            <form>
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
              </div>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="rememberMe">
                  <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="text-decoration-none">Forgot password?</a>
              </div>
              <a href="main.html" class="btn btn-primary">Sign In</a>
            </form>
            <div class="register-text">
              <small>Don't have an account? <a href="Signup.html">Register</a></small>
            </div>
          </div>
        </div>
        
  
      </div>
    </div>
  </body>
